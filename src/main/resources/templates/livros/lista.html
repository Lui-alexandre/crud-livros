<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livros</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>
<body>
<main class="pagina">
    <header class="topo">
        <h1>Estante de livros</h1>
        <a class="botao" th:href="@{/livros/novo}">Novo livro</a>
    </header>

    <p class="aviso" th:if="${mensagem}" th:text="${mensagem}"></p>

    <form class="busca" th:action="@{/livros}" method="get">
        <input type="search" name="busca" th:value="${busca}" placeholder="Buscar por título" />
        <button type="submit" class="botao botao-secundario">Buscar</button>
    </form>

    <table th:if="${!livros.isEmpty()}">
        <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th class="num">Ano</th>
            <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${livros}">
            <td th:text="${l.titulo}"></td>
            <td th:text="${l.autor}"></td>
            <td class="num" th:text="${l.ano}"></td>
            <td class="acoes">
                <a class="link" th:href="@{/livros/editar/{id}(id=${l.id})}">Editar</a>
                <form th:action="@{/livros/excluir/{id}(id=${l.id})}" method="post"
                      onsubmit="return confirm('Excluir este livro?');">
                    <button type="submit" class="link perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="vazio" th:if="${livros.isEmpty()}">
        Nenhum livro encontrado. Use "Novo livro" para cadastrar o primeiro.
    </p>
</main>
</body>
</html>
